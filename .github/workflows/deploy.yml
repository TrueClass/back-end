name: Deploy Backend
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Validate Secrets"
        run: |
          if [ -z "${{ secrets.DATABASE_HOST }}" ]; then
            echo "❌ ERRO: O segredo DATABASE_HOST está VAZIO ou não foi encontrado!"
            exit 1
          fi
          echo "✅ Segredo encontrado, prosseguindo..."

      - name: "Fix Permissions and Generate .env"
        run: |
          # Garante que estamos na pasta correta
          cd /home/joao/actions-runner/_work/back-end/back-end
          
          # Cria o arquivo diretamente usando o caminho que o systemd exige
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" > .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_PORT=${{ secrets.MYSQL_PORT }}" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env
          echo "ACCESS_SECRET_KEY=${{ secrets.ACCESS_SECRET_KEY }}" >> .env
          echo "REFRESH_SECRET_KEY=${{ secrets.REFRESH_SECRET_KEY }}" >> .env
          
          chmod 600 .env
          # Comando para debug no log do GitHub:
          ls -la .env
      
      - name: Setup Environment
        run: |
          python3 -m venv venv
          ./venv/bin/pip install -r requirements.txt

      - name: Start/Restart API
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart trueclass.service