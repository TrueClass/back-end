name: Deploy Backend
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Generate .env file from Single Secret"
        run: |
          DEST="/home/joao/actions-runner/_work/back-end/back-end/.env"
          echo '${{ secrets.ENV_FILE }}' > $DEST
          chmod 600 $DEST
      
      - name: "Validate .env existence"
        run: |
          if [ -s "/home/joao/actions-runner/_work/back-end/back-end/.env" ]; then
            echo "✅ Arquivo .env gerado com sucesso e não está vazio!"
          else
            echo "❌ ERRO: O arquivo .env está vazio ou não foi criado."
            exit 1
          fi

      - name: Setup Environment
        run: |
          python3 -m venv venv
          ./venv/bin/pip install -r requirements.txt

      - name: Start/Restart API
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart trueclass.service