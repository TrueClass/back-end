name: Deploy Backend
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Validate Secrets"
        run: |
          if [ -z "${{ secrets.DATABASE_HOST }}" ]; then
            echo "❌ ERRO: O segredo DATABASE_HOST está VAZIO ou não foi encontrado!"
            exit 1
          fi
          echo "✅ Segredo encontrado, prosseguindo..."

      - name: "Generate .env file from Single Secret"
        run: |
          DEST="/home/joao/actions-runner/_work/back-end/back-end/.env"
          echo "${{ secrets.ENV_FILE }}" > $DEST
          chmod 600 $DEST
      
      - name: Setup Environment
        run: |
          python3 -m venv venv
          ./venv/bin/pip install -r requirements.txt

      - name: Start/Restart API
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart trueclass.service